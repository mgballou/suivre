name: dependabot-automerge

# Auto-merges Dependabot's grouped minor/patch PRs once CI is green — without
# needing GitHub branch protection (unavailable on the free plan, D17). Mirrors
# deploy.yml: gate on the `tests` workflow completing successfully via
# workflow_run (which runs on the default branch with a write-capable token, the
# documented-secure Dependabot pattern), then squash-merge. Only the grouped
# minor/patch PRs qualify (branch marker "-minor-patch"); majors are ungrouped
# and stay manual.

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      contains(github.event.workflow_run.head_branch, '-minor-patch')
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the green Dependabot group PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          num=$(gh pr list --repo "$REPO" --head "$HEAD" --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then
            echo "No open PR for $HEAD — nothing to merge."
            exit 0
          fi
          echo "Merging Dependabot PR #$num ($HEAD)."
          gh pr merge "$num" --repo "$REPO" --squash --delete-branch
